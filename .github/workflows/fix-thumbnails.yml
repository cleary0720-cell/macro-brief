name: Fix Duplicate Thumbnails
on:
  push:
    branches: [main]
    paths:
      - 'images/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-thumbnails
  cancel-in-progress: false

jobs:
  thumbnails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace duplicate thumbnails
        id: fix
        run: python3 .github/scripts/fix_thumbnails.py
      - name: Commit replacements
        if: steps.fix.outputs.replaced != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/
          git commit -m "Replace duplicate thumbnails with unique Pexels photos"
          # the article agent may push again right after; rebase and retry
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 5
          done
